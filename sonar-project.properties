# SonarQube / SonarCloud configuration file
# This file is used to customize the analysis of the project

# Exclude duplication checks for files that are structurally duplicated by design
# (dashboard, views, history tables, models, controllers, and PDF utils)
sonar.cpd.exclusions=frontend/src/pages/**,frontend/src/utils/**,frontend/src/components/**,laravel-api/app/Http/Controllers/**,laravel-api/app/Models/**,laravel-api/database/**,laravel-api/routes/**
